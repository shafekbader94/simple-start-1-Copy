# ====================
# Simple Pod Example
# ====================
# This is the most basic Kubernetes resource
# A pod that runs a single nginx container

apiVersion: v1
kind: Pod
metadata:
  name: simple-nginx
  labels:
    app: nginx
    tier: frontend
spec:
  containers:
  - name: nginx
    image: nginx:latest
    ports:
    - containerPort: 80
