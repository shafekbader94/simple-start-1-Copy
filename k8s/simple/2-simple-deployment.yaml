# ====================
# Simple Deployment
# ====================
# Manages 2 nginx pods
# Auto-restarts if they crash

apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-deployment
  labels:
    app: nginx
spec:
  replicas: 2  # Run 2 pods
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
