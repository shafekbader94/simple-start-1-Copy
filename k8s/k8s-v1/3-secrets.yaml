# ====================
# Secrets - Sensitive Data
# ====================
# Stores SENSITIVE information (passwords, API keys, tokens)
# Data is base64 encoded (NOT encrypted by default!)
# Should be encrypted at rest in production

apiVersion: v1
kind: Secret
metadata:
  name: nestjs-secrets
type: Opaque
data:
  # IMPORTANT: Values must be base64 encoded!
  # To encode: echo -n "your-password" | base64
  # To decode: echo "eW91ci1wYXNzd29yZA==" | base64 -d
  
  db-password: bXlTZWN1cmVQYXNzd29yZDEyMw==  # mySecurePassword123
  jwt-secret: c3VwZXJTZWNyZXRKV1RLZXk=        # superSecretJWTKey
  api-key: YWJjMTIzZGVmNDU2            # abc123def456

---
# ====================
# How to create Secrets (Better methods)
# ====================

# Method 1: From literal values (recommended for learning)
# kubectl create secret generic nestjs-secrets \
#   --from-literal=db-password=mySecurePassword123 \
#   --from-literal=jwt-secret=superSecretJWTKey \
#   --from-literal=api-key=abc123def456

# Method 2: From .env file
# kubectl create secret generic nestjs-secrets --from-env-file=.env.secret

# Method 3: From individual files
# kubectl create secret generic nestjs-secrets \
#   --from-file=db-password=./db-password.txt \
#   --from-file=jwt-secret=./jwt-secret.txt

# ====================
# SECURITY BEST PRACTICES
# ====================
# ⚠️ Never commit this file with real secrets to Git!
# ✅ Use sealed-secrets or external secret managers (AWS Secrets Manager, Azure Key Vault)
# ✅ Enable encryption at rest in K8s
# ✅ Use RBAC to restrict access to secrets
# ✅ Rotate secrets regularly

# ====================
# How to use in Deployment (already in deployment.yaml):
# ====================
# env:
# - name: DB_PASSWORD
#   valueFrom:
#     secretKeyRef:
#       name: nestjs-secrets
#       key: db-password

# ====================
# Viewing Secrets
# ====================
# List secrets:
# kubectl get secrets
#
# View secret details (base64 encoded):
# kubectl get secret nestjs-secrets -o yaml
#
# Decode a secret:
# kubectl get secret nestjs-secrets -o jsonpath='{.data.db-password}' | base64 -d
