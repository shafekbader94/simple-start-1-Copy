# ====================
# Pod with Secret
# ====================
# Demonstrates using Secrets for sensitive data

apiVersion: v1
kind: Pod
metadata:
  name: secret-pod
spec:
  containers:
  - name: app
    image: nginx
    env:
    # Load from Secret
    - name: username
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: username
    - name: password
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: password

# To create the Secret first:
# kubectl create secret generic app-secret \
#   --from-literal=username=admin \
#   --from-literal=password=secret123
